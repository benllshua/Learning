<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>דף התחברות</title>
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/globals.css" />
    <script defer src="../assets/fonts/fontAwesome/all.min.js"></script>
  </head>

  <body>
    <div class="page-container">
      <div class="section">
        <div class="stack-container">
          <img src="../assets/svgs/blob (4).svg" />
          <img src="../assets/svgs/blob (2).svg" />
          <img src="../assets/svgs/blob (1).svg" />
          <img
            src="../assets/svgs/login-animate.svg"
            alt="login illustration"
            class="smaller above"
          />
        </div>
      </div>

      <div class="section">
        <div class="transparent-paper">
          <h1>התחברות</h1>
          <div class="field-container">
            <i class="fas fa-user-circle"></i>
            <input type="text" name="username" id="usernameInput" placeholder="שם משתמש" />
          </div>
          <div class="field-container">
            <i class="fas fa-key"></i>
            <input type="password" name="password" id="passwordInput" placeholder="סיסמא" />
          </div>
          <div class="actions-field-container">
            <button type="submit">התחבר</button>
            <p>עדיין לא רשום? <a href="./register.html">הירשם כאן!</a></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
