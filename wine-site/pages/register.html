<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>דף הרשמה</title>
    <link rel="stylesheet" href="../styles/register.css" />
    <link rel="stylesheet" href="../styles/globals.css" />
    <script defer src="../assets/fonts/fontAwesome/all.min.js"></script>
  </head>
  <body>
    <div class="page-container">
      <div class="section">
        <div class="stack-container">
          <img src="../assets/svgs/blob (4).svg" />
          <img src="../assets/svgs/blob (2).svg" />
          <img src="../assets/svgs/blob (1).svg" class="" />
          <img
            src="../assets/svgs/fill-out-animate.svg"
            alt="login illustration"
            class="smaller above"
          />
        </div>
      </div>
      <div class="section">
        <div class="transparent-paper">
          <a href="./login.html" class="back"><i class="fas fa-arrow-right"></i></a>
          <h1>דף הרשמה</h1>
          <div class="field-container">
            <i class="fas fa-user-circle"></i>
            <input type="text" name="username" id="usernameInput" placeholder="שם משתמש" />
          </div>
          <div class="field-container">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" id="passwordInput" placeholder="מייל" />
          </div>
          <div class="field-container">
            <i class="fas fa-unlock"></i>
            <input type="password" name="password" id="passwordInput" placeholder="סיסמא" />
          </div>
          <div class="field-container">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              name="confirm-password"
              id="confirm-passwordInput"
              placeholder="וידוי סיסמא"
            />
          </div>
          <div class="actions-field-container">
            <a href="./login.html">חזור</a>
            <button type="submit">הירשם כאן</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
